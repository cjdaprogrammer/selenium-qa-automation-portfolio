name: Selenium QA Automation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Chrome version
        run: |
          google-chrome --version

      - name: Remove conflicting system ChromeDriver
        run: |
          if command -v chromedriver >/dev/null 2>&1; then
            echo "Removing system ChromeDriver: $(command -v chromedriver)"
            sudo rm -f "$(command -v chromedriver)"
          fi

          if command -v chromedriver >/dev/null 2>&1; then
            echo "ERROR: ChromeDriver is still available on PATH."
            exit 1
          fi

          echo "Selenium Manager will locate a compatible ChromeDriver."

      - name: Run automated tests and generate report
        env:
          SELENIUM_BROWSER: chrome
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python -m pytest -v \
            --html=reports/report.html \
            --self-contained-html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            reports/report.html
            reports/screenshots/
          if-no-files-found: ignore